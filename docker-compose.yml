# Local development dependencies ONLY (not used on servers).
#   docker compose up -d
# Credentials below are local-only placeholders; never reuse them anywhere else.
name: fundledger-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: fundledger
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: fundledger_local_only
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fundledger"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fundledger
      MINIO_ROOT_PASSWORD: fundledger_local_only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
